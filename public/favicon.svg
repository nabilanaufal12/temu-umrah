<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo TEMU UMRAH - Master Edition">
  <defs>
    <!-- Deep Maritime Ocean Gradient -->
    <linearGradient id="maritimeOceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00355E" />
      <stop offset="50%" stop-color="#00213D" />
      <stop offset="100%" stop-color="#001224" />
    </linearGradient>

    <!-- Gurindam Emas Heritage Ring Gradient -->
    <linearGradient id="gurindamGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Star Core Radiant Gradient -->
    <radialGradient id="starRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="nauticalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base (Bentuk Bulat) -->
  <circle cx="64" cy="64" r="62" fill="url(#maritimeOceanGrad)" />

  <!-- Outer Heritage Gold Hairline Ring -->
  <circle cx="64" cy="64" r="60.5" fill="none" stroke="url(#gurindamGoldGrad)" stroke-width="1.8" />
  
  <!-- Inner Compass Track (Subtle Nautical Navigation Scale) -->
  <circle cx="64" cy="64" r="54.5" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />

  <!-- TU Ligature Monogram Group -->
  <g transform="translate(37, 33) scale(0.485)">
    <!-- Base TU Monogram in Crisp Brilliant White -->
    <path d="M 0,0 H 74 V 16 H 46 V 87 A 21 21 0 0 0 88 87 V 27 H 106 V 87 A 39 39 0 0 1 28 87 V 16 H 0 Z" 
          fill="#FFFFFF" />

    <!-- Subtle Cyan Horizon Sheen along the T Bar (Selat Malaka / Laut Natuna Horizon) -->
    <rect x="0" y="0" width="74" height="3" fill="#38BDF8" opacity="0.9" rx="1.5" />

    <!-- "Titik Temu" - Maritime Compass Guiding Star (Bintang Kejora / Pusat Titik Temu Mahasiswa) -->
    <g transform="translate(67, 57)" filter="url(#nauticalGlow)">
      <!-- 4-point Nautical Compass Star -->
      <path d="M 0,-8.5 Q 1.2,-1.2 8.5,0 Q 1.2,1.2 0,8.5 Q -1.2,1.2 -8.5,0 Q -1.2,-1.2 0,-8.5 Z" fill="url(#starRadial)" />
      <!-- Center Radiant Core -->
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
  </g>
</svg>