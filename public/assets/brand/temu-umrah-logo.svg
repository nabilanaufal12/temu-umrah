<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 80" role="img" aria-label="Logo TEMU UMRAH">
  <defs>
    <!-- Deep Maritime Ocean Gradient -->
    <linearGradient id="maritimeOceanGradLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00355E" />
      <stop offset="50%" stop-color="#00213D" />
      <stop offset="100%" stop-color="#001224" />
    </linearGradient>

    <!-- Gurindam Emas Heritage Ring Gradient -->
    <linearGradient id="gurindamGoldGradLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Star Core Radiant Gradient -->
    <radialGradient id="starRadialLg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
  </defs>

  <!-- Circular Base (Bentuk Bulat) -->
  <circle cx="36" cy="40" r="32" fill="url(#maritimeOceanGradLg)" />
  <circle cx="36" cy="40" r="30.5" fill="none" stroke="url(#gurindamGoldGradLg)" stroke-width="1.6" />
  <circle cx="36" cy="40" r="27.5" fill="none" stroke="#38BDF8" stroke-width="0.65" stroke-dasharray="2 2.5" opacity="0.45" />

  <!-- TU Ligature Monogram Group -->
  <g transform="translate(22.5, 24) scale(0.25)">
    <!-- Base TU Monogram in Crisp White -->
    <path d="M 0,0 H 74 V 16 H 46 V 87 A 21 21 0 0 0 88 87 V 27 H 106 V 87 A 39 39 0 0 1 28 87 V 16 H 0 Z" 
          fill="#FFFFFF" />

    <!-- Subtle Cyan Horizon Sheen along the T Bar -->
    <rect x="0" y="0" width="74" height="3" fill="#38BDF8" opacity="0.9" rx="1.5" />

    <!-- "Titik Temu" - Maritime Compass Star -->
    <g transform="translate(67, 57)">
      <path d="M 0,-8.5 Q 1.2,-1.2 8.5,0 Q 1.2,1.2 0,8.5 Q -1.2,1.2 -8.5,0 Q -1.2,-1.2 0,-8.5 Z" fill="url(#starRadialLg)" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="86" y="40" fill="#002B49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">TEMU</text>
  <text x="86" y="65" fill="#0284C7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="2.5">UMRAH</text>
  <path d="M211 52h145" stroke="#E2E8F0" stroke-width="1"/>
  <text x="211" y="43" fill="#64748B" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2">PORTAL KEGIATAN MAHASISWA</text>
</svg>
